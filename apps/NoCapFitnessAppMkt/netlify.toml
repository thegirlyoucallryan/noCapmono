# Use this only if Netlify "Base directory" is set to apps/NoCapFitnessAppMkt.
# Prefer the root netlify.toml (leave Base directory empty) for this monorepo.

[build]
  command = "cd ../.. && npm install && npm run build -w nocapfitnessappmkt"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
